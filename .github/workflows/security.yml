name: Security
on:
  push:
  pull_request:
    branches: [main, availability-overhaul]
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  security:
    name: security (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'schedule' && '["main","availability-overhaul"]' || '["current"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.target == 'current' && github.sha || matrix.target }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install pinned checks
        run: |
          python -m pip install -r requirements-security.txt > "$RUNNER_TEMP/security-install.log" 2>&1
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/security-browser-install.log" 2>&1
      - name: Run required security gate
        env:
          CI: 'true'
        run: |
          if [ '${{ github.event.schedule }}' = '0 11 * * *' ]; then
            python scripts/security_check.py ci --advisories-only
          else
            python scripts/security_check.py ci
          fi
