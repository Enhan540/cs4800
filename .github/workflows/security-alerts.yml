name: Retry security alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-alert-dispatch
  cancel-in-progress: false
jobs:
  retry:
    if: github.ref == 'refs/heads/main' && vars.SECURITY_ALERT_RETRIES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: security-alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt > "$RUNNER_TEMP/alert-install.log" 2>&1
      - name: Retry a bounded batch
        env:
          MONGO_URI: ${{ secrets.ALERT_MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.ALERT_MONGO_DB_NAME }}
          RESEND_API_KEY: ${{ secrets.ALERT_RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          APP_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: python scripts/security_dispatch_alerts.py --limit 50
