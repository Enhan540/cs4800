{% extends "base.html" %}{% block title %}Complete account setup | Group Planner{% endblock %}{% block content %}<section class="auth-shell"><div class="card auth-card"><p class="eyebrow">Complete Account</p><h1>Choose a username</h1><p class="muted">Your username is how other Group Planner members will identify you.</p><form method="post" class="auth-form"><label>Username<input name="username" value="{{ username }}" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,39}" required autofocus autocomplete="username"></label><button class="button auth-submit" type="submit">Continue</button></form><form method="post" action="{{ url_for('logout') }}"><button class="button secondary" type="submit">Log out</button></form></div></section>{% endblock %}
