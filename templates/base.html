<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Group Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="{{ url_for('index') }}">Group Planner</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('groups') }}">Groups</a>
        <a href="{{ url_for('users') }}">Members</a>
      </nav>
    </div>
  </header>
  <main class="container page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages" aria-live="polite">
          {% for category, message in messages %}<p class="message {{ category }}">{{ message }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
