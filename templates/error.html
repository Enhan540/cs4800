{% extends "base.html" %}
{% block title %}{{ code }} | Group Planner{% endblock %}
{% block content %}<section class="card empty-state error-page"><span class="error-mark" aria-hidden="true">!</span><p class="eyebrow">Error {{ code }}</p><h1>{{ message }}</h1><p class="muted">The requested page could not be completed.</p><a class="button" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}">{{ 'Return to dashboard' if current_user.is_authenticated else 'Return home' }}</a></section>{% endblock %}
