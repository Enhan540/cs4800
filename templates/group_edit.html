{% extends "base.html" %}
{% block title %}Edit {{ group.name }} | Meetwise{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('group_detail', group_id=group._id) }}">← Back to {{ group.name }}</a>
<section class="narrow-page with-back-link">
  <p class="eyebrow">Group settings</p>
  <h1>Edit group</h1>
  <section class="card">
    <form method="post">
      <label for="name">Group name<input id="name" name="name" required maxlength="120" value="{{ form.get('name', '') }}"></label>
      <label for="description">Description <span class="optional">optional</span><textarea id="description" name="description" rows="4">{{ form.get('description') or '' }}</textarea></label>
      <div class="button-row">
        <button class="button" type="submit">Save changes</button>
        <a class="button secondary" href="{{ url_for('group_detail', group_id=group._id) }}">Cancel</a>
      </div>
    </form>
  </section>
</section>
{% endblock %}
