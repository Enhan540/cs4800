{% extends "base.html" %}{% block title %}Change username | Group Planner{% endblock %}{% block content %}<section class="narrow-page"><a class="back-link" href="{{ url_for('account') }}">← Back to Account</a><section class="card account-section"><p class="eyebrow">Profile</p><h1>Change Username</h1><p class="muted">Current username: {{ account.username }}</p><form method="post" class="auth-form compact-form"><label>New Username<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,39}" required autofocus autocomplete="username"></label><button class="button" type="submit">Save</button><a class="button secondary" href="{{ url_for('account') }}">Cancel</a></form></section></section>{% endblock %}
