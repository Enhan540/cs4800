{% extends "base.html" %}
{% block title %}Submit availability | CS4800{% endblock %}
{% block content %}
<section class="hero">
  <p class="eyebrow">CS4800 group scheduling</p>
  <h1>When are you available?</h1>
  <p>Submit one availability window so your project group can see when participants are free.</p>
</section>
<section class="card">
  <form id="availability-form" action="{{ url_for('submit') }}" method="post" novalidate>
    <div class="form-grid">
      <label for="name">Name
        <input id="name" name="name" type="text" maxlength="100" required value="{{ form.get('name', '') if form else '' }}" autocomplete="name">
      </label>
      <label for="day">Day of the week
        <select id="day" name="day" required>
          <option value="">Choose a day</option>
          {% for day in days %}
            <option value="{{ day }}" {% if form and form.get('day') == day %}selected{% endif %}>{{ day }}</option>
          {% endfor %}
        </select>
      </label>
      <label for="start_time">Start time
        <input id="start_time" name="start_time" type="time" required value="{{ form.get('start_time', '') if form else '' }}">
      </label>
      <label for="end_time">End time
        <input id="end_time" name="end_time" type="time" required value="{{ form.get('end_time', '') if form else '' }}">
      </label>
    </div>
    <p id="form-error" class="form-error" role="alert"></p>
    <button class="button" type="submit">Submit availability</button>
  </form>
</section>
{% endblock %}
