{% extends "base.html" %}
{% block title %}Log in | Group Planner{% endblock %}
{% block content %}
<section class="auth-shell"><div class="card auth-card"><p class="eyebrow">Welcome back</p><h1>Log in</h1><p class="muted auth-intro">Continue planning with your groups.</p>
  <form method="post" class="auth-form">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <label for="username">Username<input id="username" name="username" value="{{ username }}" required autocomplete="username" autofocus></label>
    <label for="password">Password<span class="password-control"><input id="password" name="password" type="password" required autocomplete="current-password" data-password-input><button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" data-password-toggle>Show</button></span></label>
    <button class="button auth-submit" type="submit">Log In</button>
  </form>
  <div class="auth-divider"><span>or</span></div>
  <a class="button google-button" href="{{ url_for('google_auth') }}"><span class="google-mark" aria-hidden="true">G</span>Continue with Google</a>
  <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p>
</div></section>
{% endblock %}
